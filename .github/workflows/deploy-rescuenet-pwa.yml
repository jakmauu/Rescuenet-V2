name: Deploy RescueNet PWA preview

on:
  push:
    branches: [main]
    paths:
      - 'Rescuenet-apk/pwa/**'
      - '.github/workflows/deploy-rescuenet-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rescuenet-pwa-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static PWA files
        run: |
          mkdir -p _site/assets
          cp Rescuenet-apk/pwa/index.html Rescuenet-apk/pwa/app.mjs Rescuenet-apk/pwa/core.mjs Rescuenet-apk/pwa/location-scheduler.mjs Rescuenet-apk/pwa/styles.css Rescuenet-apk/pwa/manifest.webmanifest Rescuenet-apk/pwa/service-worker.js Rescuenet-apk/pwa/icon.svg _site/
          cp Rescuenet-apk/pwa/assets/rescuenet-logo.png _site/assets/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
